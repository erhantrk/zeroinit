<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZeroInit dashboard (testnet)</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fafafa; color: #222; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600; color: #fff; }
  .NONEXISTENT { background: #888; } .UNINITIALIZED { background: #c80; } .OPEN { background: #06c; }
  .PAID { background: #090; } .EXPIRED { background: #a00; }
  code { font-size: 13px; word-break: break-all; }
  input { width: 100%; margin: 2px 0 8px; padding: 4px; box-sizing: border-box; }
  pre { background: #111; color: #eee; padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>ZeroInit <small>(NEAR testnet)</small></h1>
<div class="cols">
  <div class="card">
    <h2>Merchant</h2>
    <label>Invoice id <input id="id" value="INV-WEB-1"></label>
    <label>Merchant <input id="merchant"></label>
    <label>Tax vault <input id="tax_vault"></label>
    <label>Tax bps <input id="tax_bps" value="800"></label>
    <label>Amount (NEAR) <input id="amount_near" value="1"></label>
    <label>Expires in (minutes) <input id="expires_in_minutes" value="120"></label>
    <button id="create">Create invoice (no transaction)</button>
    <div id="invoices"></div>
  </div>
  <div class="card">
    <h2>Payer</h2>
    <div id="selected">Select an invoice on the left.</div>
    <button id="pay" disabled>Pay (one transaction)</button>
    <button id="sweep" disabled>Sweep (after a plain transfer)</button>
    <pre id="log"></pre>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let selected = null;
const log = (o) => { $('log').textContent = JSON.stringify(o, null, 2) + '\n' + $('log').textContent; };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
async function refresh() {
  const docs = await api('GET', '/api/invoices');
  const rows = await Promise.all(docs.map(async (d) => ({ d, s: await api('GET', `/api/invoices/${d.invoice_id}/status`) })));
  $('invoices').innerHTML = rows.map(({ d, s }) => {
    const label = s.state === 'INITIALIZED' && s.invoice ? s.invoice.status : s.state;
    return `<p><a href="#" data-id="${d.invoice_id}">${d.invoice_id}</a> <span class="badge ${label}">${label}</span><br><code>${d.account_id}</code><br>${d.amount_near} NEAR</p>`;
  }).join('');
  document.querySelectorAll('[data-id]').forEach((a) => a.onclick = (e) => { e.preventDefault(); select(a.dataset.id, rows); });
  if (selected) select(selected, rows);
}
function select(id, rows) {
  selected = id;
  const row = rows.find((r) => r.d.invoice_id === id);
  if (!row) return;
  $('selected').innerHTML = `<p><b>${id}</b>: pay <b>${row.d.amount_near} NEAR</b> to<br><code>${row.d.account_id}</code></p>`;
  $('pay').disabled = false; $('sweep').disabled = false;
}
$('create').onclick = async () => {
  const body = Object.fromEntries(['id', 'merchant', 'tax_vault', 'tax_bps', 'amount_near', 'expires_in_minutes'].map((k) => [k, $(k).value]));
  log(await api('POST', '/api/invoices', body)); refresh();
};
$('pay').onclick = async () => { log(await api('POST', `/api/invoices/${selected}/pay`, {})); refresh(); };
$('sweep').onclick = async () => { log(await api('POST', `/api/invoices/${selected}/sweep`, {})); refresh(); };
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>

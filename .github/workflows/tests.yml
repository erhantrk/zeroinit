name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    name: offline tests + judge path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash scripts/judge-offline.sh
      - name: The npm CLI package builds and runs
        run: |
          npm run build:cli
          node cli/dist/zeroinit.mjs replay fixtures/v32r/demo-run.json > /dev/null
  contract:
    name: contract unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - run: cd contract && cargo test

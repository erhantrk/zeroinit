name: release
# Runs when a GitHub release is published. Rebuilds the MCP bundle from source, checks it is the committed file,
# attaches it to the release and publishes the package.
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  mcp-package:
    name: MCP package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: node --test test/mcp.test.ts
      - name: Rebuild the bundle and check it is the committed file
        run: |
          npm run build:mcp
          git diff --exit-code -- mcp/dist/zeroinit-mcp.mjs
      - name: Check the package version is the release tag
        run: test "v$(node -p "require('./mcp/package.json').version")" = "${{ github.event.release.tag_name }}"
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mcp/dist/zeroinit-mcp.mjs --clobber
      - name: Publish zeroinit-mcp to npm (trusted publishing, no stored token)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        working-directory: mcp
        run: |
          npm install -g npm@11
          npm publish --access public --provenance
      - name: Publish @erhantrk/zeroinit-mcp to GitHub Packages
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set name=@erhantrk/zeroinit-mcp
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish --registry https://npm.pkg.github.com

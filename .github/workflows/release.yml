name: release
# Runs when a GitHub release is published. Rebuilds the MCP bundle from source, checks it is the committed file,
# attaches it to the release, builds the npm package (CLI, library and MCP server) and publishes it.
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: node --test test/mcp.test.ts
      - name: Rebuild the bundle and check it is the committed file
        run: |
          npm run build:mcp
          git diff --exit-code -- mcp/dist/zeroinit-mcp.mjs
      - name: Check the package version is the release tag
        run: |
          test "v$(node -p "require('./cli/package.json').version")" = "${{ github.event.release.tag_name }}"
      - name: Build the CLI package and run it from the build
        run: |
          npm run build:cli
          node cli/dist/zeroinit.mjs vectors
          node cli/dist/zeroinit.mjs replay fixtures/v32r/demo-run.json > /dev/null
          cmp mcp/dist/zeroinit-mcp.mjs cli/dist/zeroinit-mcp.mjs
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mcp/dist/zeroinit-mcp.mjs --clobber
      - name: Publish @erhantrk/zeroinit to npm (trusted publishing, no stored token)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          npm install -g npm@11
          (cd cli && npm publish --access public --provenance)
      - name: Publish @erhantrk/zeroinit to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          (cd cli && npm publish --registry https://npm.pkg.github.com)

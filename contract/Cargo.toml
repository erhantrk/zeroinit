[package]
name = "zeroinit-invoice"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/erhantrk/zeroinit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Reproducible build (cargo near build reproducible-wasm): anyone can rebuild the deployed wasm from this commit.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
image_digest = "sha256:8013f039e8005627f10ae66b5519d1a6eeeed7d7aef4b5067d5e9a86c4302fcc"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]


[package]
name = "zeroinit-invoice"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.95.0"
image_digest = "UNSET"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

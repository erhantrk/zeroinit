<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZeroInit dashboard (testnet)</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fafafa; color: #222; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-weight: 600; color: #fff; font-size: 16px; }
  .NONEXISTENT { background: #888; } .UNINITIALIZED { background: #c80; } .OPEN { background: #06c; }
  .PAID { background: #090; } .EXPIRED { background: #a00; } .SETTLING { background: #b60; } .REFUNDED { background: #639; }
  .LOADING { background: #bbb; } .ERROR { background: #555; }
  code { font-size: 13px; word-break: break-all; }
  input, select { width: 100%; margin: 2px 0 8px; padding: 4px; box-sizing: border-box; }
  pre { background: #111; color: #eee; padding: 8px; border-radius: 6px; max-height: 560px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>ZeroInit <small>(NEAR testnet; v-next: v3 is not deployed yet)</small></h1>
<div class="cols">
  <div class="card">
    <h2>Merchant</h2>
    <label>Invoice id <input id="id" value="INV-WEB-1"></label>
    <label>Merchant <input id="merchant"></label>
    <label>Tax vault <input id="tax_vault"></label>
    <label>Tax bps <input id="tax_bps" value="800"></label>
    <label>Asset <select id="asset"><option value="near">NEAR</option><option value="tUSDC">tUSDC</option></select></label>
    <label>Amount (display units) <input id="amount" value="1"></label>
    <label>Expires in (minutes) <input id="expires_in_minutes" value="120"></label>
    <label>Refund grace (ms, token/NEP-141 invoices; 0 = default 7 days) <input id="payout_grace_ms" value=""></label>
    <button id="create">Create invoice (no transaction)</button>
    <p><button id="refresh">Refresh statuses</button> <span id="refreshing"></span></p>
    <div id="invoices"></div>
  </div>
  <div class="card">
    <h2>Payer</h2>
    <div id="selected">Select an invoice on the left.</div>
    <button id="pay" disabled>Pay (one transaction)</button>
    <button id="plain" disabled>Send plain transfer (exchange path)</button>
    <button id="sweep" disabled>Sweep (settle funds that arrived without a call)</button>
    <button id="refund" disabled>Refund payer (after the grace period)</button>
    <pre id="log"></pre>
  </div>
</div>
<script type="module">
import { FORM_FIELDS, formBody, invoiceRows, amountLabel, selection } from '/state.js';
const $ = (id) => document.getElementById(id);
let selected = null;
const log = (o) => { $('log').textContent = JSON.stringify(o, null, 2) + '\n' + $('log').textContent; };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
// Last known status per invoice: a refresh keeps showing it until the new one arrives (no flash back to LOADING).
const known = new Map();
let busy = false, again = false;
async function refresh() {
  if (busy) { again = true; return; }   // never overlap refreshes; one more runs after the current one
  busy = true; $('refresh').disabled = true; $('refreshing').textContent = 'checking testnet…';
  try { await refreshOnce(); } finally { busy = false; $('refresh').disabled = false; $('refreshing').textContent = ''; }
  if (again) { again = false; refresh(); }
}
async function refreshOnce() {
  const docs = await api('GET', '/api/invoices');
  const statuses = docs.map((d) => known.get(d.invoice_id));
  const draw = () => {
    const rows = invoiceRows(docs, statuses);
    $('invoices').innerHTML = rows.map(({ doc: d, status, label }) =>
      `<p><a href="#" data-id="${d.invoice_id}">${d.invoice_id}</a> <span class="badge ${label}">${label}</span><br><code>${d.account_id}</code><br>${amountLabel(d, status)}</p>`).join('');
    document.querySelectorAll('[data-id]').forEach((a) => a.onclick = (e) => { e.preventDefault(); select(a.dataset.id, rows); });
    if (selected) select(selected, rows);
  };
  draw();   // the list shows at once; each badge fills in when its status arrives
  // At most 4 status lookups at a time: each one is 1-2 RPC calls, and a burst of ~60 makes public testnet RPCs answer 429.
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(4, docs.length) }, async () => {
    while (next < docs.length) { const i = next++; statuses[i] = await api('GET', `/api/invoices/${docs[i].invoice_id}/status`); known.set(docs[i].invoice_id, statuses[i]); draw(); }
  }));
}
function select(id, rows) {
  selected = id;
  const row = selection(rows, id);
  if (!row) return;
  $('selected').innerHTML = `<p><b>${row.id}</b>: pay <b>${row.amountLabel}</b> to<br><code>${row.accountId}</code></p>`;
  for (const b of ['pay', 'plain', 'sweep', 'refund']) $(b).disabled = false;
}
$('create').onclick = async () => {
  const values = Object.fromEntries(FORM_FIELDS.map((k) => [k, $(k).value]));
  log(await api('POST', '/api/invoices', formBody(values))); refresh();
};
for (const action of ['pay', 'plain', 'sweep', 'refund']) {
  $(action).onclick = async () => { log(await api('POST', `/api/invoices/${selected}/${action}`, {})); refresh(); };
}
$('refresh').onclick = () => refresh();
// No polling: statuses load once when the page opens, after each action, and when Refresh is clicked
// (each status is ~2 RPC calls; polling every few seconds got public testnet RPCs to answer 429).
refresh();
</script>
</body>
</html>

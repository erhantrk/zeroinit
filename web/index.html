<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZeroInit dashboard (testnet)</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; background: #fafafa; color: #222; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-weight: 600; color: #fff; font-size: 16px; }
  .NONEXISTENT { background: #888; } .UNINITIALIZED { background: #c80; } .OPEN { background: #06c; }
  .PAID { background: #090; } .EXPIRED { background: #a00; } .SETTLING { background: #b60; } .REFUNDED { background: #639; }
  .LOADING { background: #bbb; } .ERROR { background: #555; } .UNKNOWN { background: #555; } .UNVERIFIED { background: #d00; }
  code { font-size: 13px; word-break: break-all; }
  input, select { width: 100%; margin: 2px 0 8px; padding: 4px; box-sizing: border-box; }
  pre { background: #111; color: #eee; padding: 8px; border-radius: 6px; max-height: 560px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>ZeroInit <small>(NEAR testnet; contract v3.2r, NEAR and tUSDC)</small></h1>
<div class="cols">
  <div class="card">
    <h2>Merchant</h2>
    <label>Invoice id <input id="id" value="INV-WEB-1"></label>
    <label>Merchant <input id="merchant"></label>
    <label>Tax vault <input id="tax_vault"></label>
    <label>Tax bps <input id="tax_bps" value="800"></label>
    <label>Asset <select id="asset"><option value="near">NEAR</option><option value="tUSDC">tUSDC</option></select></label>
    <label>Amount (display units) <input id="amount" value="1"></label>
    <label>Expires in (minutes) <input id="expires_in_minutes" value="120"></label>
    <label>Refund grace (ms, 60000 to 31536000000; empty = default 7 days; also applies to NEAR invoices) <input id="payout_grace_ms" value=""></label>
    <button id="create">Create invoice (no transaction)</button>
    <p><button id="refresh">Refresh statuses</button> <span id="refreshing"></span></p>
    <div id="invoices"></div>
  </div>
  <div class="card">
    <h2>Payer</h2>
    <div id="selected">Select an invoice on the left.</div>
    <button id="pay" disabled>Pay (one transaction)</button>
    <button id="plain" disabled>Send plain transfer (exchange path)</button>
    <button id="sweep" disabled>Sweep (settle funds that arrived without a call)</button>
    <button id="refund" disabled>Refund payer (after the grace period)</button>
    <pre id="log"></pre>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>

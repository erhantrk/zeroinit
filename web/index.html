<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZeroInit dashboard (testnet)</title>
<style>
  :root { --paper: #F6F5F1; --card: #FBFAF7; --ink: #111110; --muted: #6B6A65; --line: rgba(17,17,16,.12); --line-strong: rgba(17,17,16,.24); --paid: #1F6B4C;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; margin: 0; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header svg { height: 30px; width: auto; display: block; }
  h1 { margin: 0; font-size: 15px; font-weight: 400; color: var(--muted); }
  h1 .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  h1 small { font-size: inherit; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding: 24px; max-width: 1360px; margin: 0 auto; }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); }
  input, select { width: 100%; margin: 3px 0 10px; padding: 7px 9px; font: 14px/1.3 var(--mono); color: var(--ink); background: #fff; border: 1px solid var(--line-strong); border-radius: 6px; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--paid); outline-offset: 2px; }
  button { font: inherit; font-size: 14px; padding: 7px 12px; margin: 0 6px 8px 0; border-radius: 6px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { color: #a3a29c; cursor: default; }
  #create, #pay { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  #create:hover, #pay:hover:not(:disabled) { background: #2a2a28; }
  #pay:disabled { background: #c9c8c2; border-color: #c9c8c2; color: #fff; }
  #refreshing { color: var(--muted); font-size: 13px; }
  #invoices > * { padding: 10px 0; border-top: 1px solid var(--line); }
  #invoices a, #selected a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
  #selected { margin-bottom: 14px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font: 600 12px/1.5 var(--mono); letter-spacing: .03em; color: #fff; vertical-align: 1px; }
  .NONEXISTENT { background: #8a8983; } .UNINITIALIZED { background: #a8690a; } .OPEN { background: #2b5ea8; }
  .PAID { background: var(--paid); } .EXPIRED { background: #a3261c; } .SETTLING { background: #a8690a; } .REFUNDED { background: #6a4a93; }
  .LOADING { background: #bdbcb6; } .ERROR { background: #555; } .UNKNOWN { background: #555; } .UNVERIFIED { background: #c2180c; }
  code { font: 13px/1.4 var(--mono); word-break: break-all; }
  pre { background: var(--ink); color: #e9e8e3; padding: 12px; border-radius: 6px; max-height: 560px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; }
  pre:empty { display: none; }
</style>
</head>
<body>
<header>

<h1><span class="sr">ZeroInit </span><small>Local dashboard · NEAR testnet · contract v3.2r · NEAR and tUSDC</small></h1>
</header>
<div class="cols">
  <div class="card">
    <h2>Merchant</h2>
    <label>Invoice id <input id="id" value="INV-WEB-1"></label>
    <label>Merchant <input id="merchant"></label>
    <label>Tax vault <input id="tax_vault"></label>
    <label>Tax bps <input id="tax_bps" value="800"></label>
    <label>Asset <select id="asset"><option value="near">NEAR</option><option value="tUSDC">tUSDC</option></select></label>
    <label>Amount (display units) <input id="amount" value="1"></label>
    <label>Expires in (minutes) <input id="expires_in_minutes" value="120"></label>
    <label>Refund grace (ms, 60000 to 31536000000; empty = default 7 days; also applies to NEAR invoices) <input id="payout_grace_ms" value=""></label>
    <button id="create">Create invoice (no transaction)</button>
    <p><button id="refresh">Refresh statuses</button> <span id="refreshing"></span></p>
    <div id="invoices"></div>
  </div>
  <div class="card">
    <h2>Payer</h2>
    <div id="selected">Select an invoice on the left.</div>
    <button id="pay" disabled>Pay (one transaction)</button>
    <button id="plain" disabled>Send plain transfer (exchange path)</button>
    <button id="sweep" disabled>Sweep (settle funds that arrived without a call)</button>
    <button id="refund" disabled>Refund payer (after the grace period)</button>
    <pre id="log"></pre>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
